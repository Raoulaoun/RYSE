# Render Blueprint: the marketing site as a free static site (no forms, no admin).
# Apply and Partner buttons open an email to hello@ryseventure.com.
# The full app with forms, database and admin is in render.full.yaml; rename it
# to render.yaml to use it (paid plans).
services:
  - type: web
    name: ryse-site
    runtime: static
    branch: claude/vibrant-tesla-j4ymni
    buildCommand: npm ci && npm run build:static
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: "22"
